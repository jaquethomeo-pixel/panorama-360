<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Panorama 360</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }
    #panorama {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="panorama"></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<script>
  pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "DSCN0021.JPG",
    "autoLoad": true,
    "showControls": true
  });
</script>

</body>
</html>
